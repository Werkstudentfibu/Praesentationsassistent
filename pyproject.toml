[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "praesentationsassistent"
version = "0.2.1"
description = "Visual-Identity-Praesentationsassistent (Grundgeruest -- noch ohne Markenregeln/Langdock-Anschluss)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "python-pptx>=1.0",
    "pillow>=10.4",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[project.scripts]
praesentationsassistent = "praesentationsassistent.cli:main"

[tool.hatchling.build.targets.wheel]
packages = ["praesentationsassistent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
